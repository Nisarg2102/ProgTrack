# ===========================
# ProgTrack Application Config
# ===========================

spring.application.name=ProgTrack

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/progtrack_db
spring.datasource.username=root
spring.datasource.password=tiger
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Server ---
server.port=8080
server.servlet.session.timeout=8h
server.servlet.context-path=/

# --- Security ---
spring.security.user.name=admin
spring.security.user.password=admin123

# --- File Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging ---
logging.level.com.threespace.progtrack=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO

# --- WebSocket ---
spring.websocket.max-text-message-size=65536

# --- App Custom Properties ---
app.name=ProgTrack
app.company=3Space Technologies
app.version=1.0.0
app.timezone=Asia/Kolkata

