<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Team Analytics — ProgTrack</title>
</head>
<body>
<section layout:fragment="content">

  <!-- ── 1. DATE RANGE FILTER ──────────────────────────────────────────────── -->
  <div class="card shadow-sm border-0 mb-4" style="border-top: 4px solid #6f42c1 !important; background-color: var(--bs-card-bg);">
    <div class="card-body p-4">
      <form th:action="@{/reports/team}" method="get" class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label small fw-bold text-secondary text-uppercase" style="letter-spacing: 0.5px;">From Date</label>
          <input type="date" name="from" class="form-control shadow-none bg-light border-0"
                 th:value="${from != null ? #temporals.format(from, 'yyyy-MM-dd') : ''}"/>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold text-secondary text-uppercase" style="letter-spacing: 0.5px;">To Date</label>
          <input type="date" name="to" class="form-control shadow-none bg-light border-0"
                 th:value="${to != null ? #temporals.format(to, 'yyyy-MM-dd') : ''}"/>
        </div>
        <div class="col-md-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary fw-bold shadow-sm px-4">
            <i class="bi bi-funnel-fill me-2"></i>Apply Range
          </button>
          <a th:href="@{/reports/team}" class="btn btn-light fw-bold shadow-sm border px-4">Reset</a>
        </div>
      </form>
    </div>
  </div>

  <!-- ── 2. KPI METRICS CARDS ──────────────────────────────────────────────── -->
  <!-- Adjusted to col-lg-4 to perfectly fit 6 cards in two clean rows -->
  <div class="row g-4 mb-4">
    <!-- Total Tasks -->
    <div class="col-lg-4 col-md-6">
      <div class="card shadow-sm border-0 h-100" style="border-left: 4px solid #4154f1 !important; background-color: var(--bs-card-bg);">
        <div class="card-body d-flex align-items-center p-4">
          <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
            <i class="bi bi-list-task text-primary fs-4"></i>
          </div>
          <div>
            <h3 class="fw-bold text-body mb-0" th:text="${totalTasks ?: '0'}">0</h3>
            <small class="text-muted fw-semibold text-uppercase" style="font-size: 11px; letter-spacing: 0.5px;">Total Tasks</small>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Completed Tasks -->
    <div class="col-lg-4 col-md-6">
      <div class="card shadow-sm border-0 h-100" style="border-left: 4px solid #198754 !important; background-color: var(--bs-card-bg);">
        <div class="card-body d-flex align-items-center p-4">
          <div class="rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
            <i class="bi bi-check-circle-fill text-success fs-4"></i>
          </div>
          <div>
            <h3 class="fw-bold text-body mb-0" th:text="${completedTasks ?: '0'}">0</h3>
            <small class="text-muted fw-semibold text-uppercase" style="font-size: 11px; letter-spacing: 0.5px;">Completed</small>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Completion Rate -->
    <div class="col-lg-4 col-md-6">
      <div class="card shadow-sm border-0 h-100" style="border-left: 4px solid #ffc107 !important; background-color: var(--bs-card-bg);">
        <div class="card-body d-flex align-items-center p-4">
          <div class="rounded-circle bg-warning bg-opacity-10 d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
            <i class="bi bi-graph-up-arrow text-warning fs-4"></i>
          </div>
          <div>
            <h3 class="fw-bold text-body mb-0" th:text="|${completionRate ?: 0}%|">0%</h3>
            <small class="text-muted fw-semibold text-uppercase" style="font-size: 11px; letter-spacing: 0.5px;">Completion Rate</small>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Total Hours -->
    <div class="col-lg-4 col-md-6">
      <div class="card shadow-sm border-0 h-100" style="border-left: 4px solid #0dcaf0 !important; background-color: var(--bs-card-bg);">
        <div class="card-body d-flex align-items-center p-4">
          <div class="rounded-circle bg-info bg-opacity-10 d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
            <i class="bi bi-clock-fill text-info fs-4"></i>
          </div>
          <div>
            <h3 class="fw-bold text-body mb-0" th:text="|${totalHours ?: 0.0}h|">0h</h3>
            <small class="text-muted fw-semibold text-uppercase" style="font-size: 11px; letter-spacing: 0.5px;">Hours Logged</small>
          </div>
        </div>
      </div>
    </div>

    <!-- NEW KPI: Active Contributors -->
    <div class="col-lg-4 col-md-6">
      <div class="card shadow-sm border-0 h-100" style="border-left: 4px solid #6f42c1 !important; background-color: var(--bs-card-bg);">
        <div class="card-body d-flex align-items-center p-4">
          <div class="rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px; background-color: rgba(111, 66, 193, 0.1);">
            <i class="bi bi-people-fill fs-4" style="color: #6f42c1;"></i>
          </div>
          <div>
            <h3 class="fw-bold text-body mb-0" id="kpi-active-interns">0</h3>
            <small class="text-muted fw-semibold text-uppercase" style="font-size: 11px; letter-spacing: 0.5px;">Active Contributors</small>
          </div>
        </div>
      </div>
    </div>

    <!-- NEW KPI: Blocked Issues -->
    <div class="col-lg-4 col-md-6">
      <div class="card shadow-sm border-0 h-100" style="border-left: 4px solid #dc3545 !important; background-color: var(--bs-card-bg);">
        <div class="card-body d-flex align-items-center p-4">
          <div class="rounded-circle bg-danger bg-opacity-10 d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
            <i class="bi bi-slash-circle-fill text-danger fs-4"></i>
          </div>
          <div>
            <h3 class="fw-bold text-body mb-0" id="kpi-blocked-tasks">0</h3>
            <small class="text-muted fw-semibold text-uppercase" style="font-size: 11px; letter-spacing: 0.5px;">Blocked Tasks</small>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── 3. HIDDEN CRASH-PROOF CHART DATA ──────────────────────────────────── -->
  <!-- Original Chart Data -->
  <th:block th:if="${memberTaskCount != null and not memberTaskCount.empty}">
      <div id="hiddenBarData" style="display: none;">
          <span class="bar-data" th:each="entry : ${memberTaskCount}" th:data-name="${entry.key}" th:data-val="${entry.value}"></span>
      </div>
  </th:block>

  <th:block th:if="${statusBreakdown != null and not statusBreakdown.empty}">
      <div id="hiddenPieData" style="display: none;">
          <span class="pie-data" th:each="entry : ${statusBreakdown}" th:data-key="${entry.key}" th:data-val="${entry.value}"></span>
      </div>
  </th:block>

  <!-- Expanded Raw Data Extractor for Advanced Charts -->
  <div id="rawTaskData" style="display: none;">
      <th:block th:if="${tasks != null}">
          <span class="raw-task" th:each="t : ${tasks}" 
                th:if="${t != null}"
                th:data-user="${t.user?.fullName ?: 'Unknown'}" 
                th:data-hours="${t.timeSpent ?: 0.0}" 
                th:data-priority="${t.priority ?: 'MEDIUM'}"
                th:data-category="${t.taskCategory ?: 'Uncategorized'}"
                th:data-status="${t.status != null ? t.status.name() : 'UNKNOWN'}"
                th:data-date="${t.taskDate != null ? #temporals.format(t.taskDate, 'yyyy-MM-dd') : ''}"></span>
      </th:block>
  </div>

  <!-- ── 4. ANALYTICS CHARTS (ROW 1 - Existing) ────────────────────────────── -->
  <div class="row g-4 mb-4 align-items-stretch">
    <!-- Bar Chart: Tasks per Member -->
    <div class="col-lg-7">
      <div class="card shadow-sm border-0 h-100 d-flex flex-column" style="background-color: var(--bs-card-bg);">
        <div class="card-body p-4 d-flex flex-column">
          <h5 class="card-title fw-bold text-body mb-4 m-0"><i class="bi bi-bar-chart-fill text-primary me-2"></i>Tasks per Team Member</h5>
          <div class="flex-grow-1 d-flex align-items-center justify-content-center w-100" id="barChartContainer">
            <canvas id="memberTaskChart" style="max-height: 300px; width: 100%;"></canvas>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Pie Chart: Status -->
    <div class="col-lg-5">
      <div class="card shadow-sm border-0 h-100 d-flex flex-column" style="background-color: var(--bs-card-bg);">
        <div class="card-body p-4 d-flex flex-column">
          <h5 class="card-title fw-bold text-body mb-4 m-0"><i class="bi bi-pie-chart-fill text-success me-2"></i>Status Distribution</h5>
          <div class="flex-grow-1 d-flex align-items-center justify-content-center w-100" id="pieChartContainer">
            <canvas id="statusPieChart" style="max-height: 300px; width: 100%;"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 5. ANALYTICS CHARTS (ROW 2 - Existing Add-ons) ────────────────────── -->
  <div class="row g-4 mb-4 align-items-stretch">
    <!-- Horizontal Bar Chart: Hours per Member -->
    <div class="col-lg-7">
      <div class="card shadow-sm border-0 h-100 d-flex flex-column" style="background-color: var(--bs-card-bg);">
        <div class="card-body p-4 d-flex flex-column">
          <h5 class="card-title fw-bold text-body mb-4 m-0"><i class="bi bi-clock-history text-warning me-2"></i>Hours Logged per Member</h5>
          <div class="flex-grow-1 d-flex align-items-center justify-content-center w-100" id="hoursChartContainer">
            <canvas id="memberHoursChart" style="max-height: 300px; width: 100%;"></canvas>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Doughnut Chart: Priority -->
    <div class="col-lg-5">
      <div class="card shadow-sm border-0 h-100 d-flex flex-column" style="background-color: var(--bs-card-bg);">
        <div class="card-body p-4 d-flex flex-column">
          <h5 class="card-title fw-bold text-body mb-4 m-0"><i class="bi bi-exclamation-octagon-fill text-danger me-2"></i>Task Priority Breakdown</h5>
          <div class="flex-grow-1 d-flex align-items-center justify-content-center w-100" id="priorityChartContainer">
            <canvas id="priorityChart" style="max-height: 300px; width: 100%;"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 6. ANALYTICS CHARTS (ROW 3 - NEW DEPARTMENT VISUALS) ──────────────── -->
  <div class="row g-4 mb-5 align-items-stretch">
    <!-- Line Chart: Activity Trend Over Time -->
    <div class="col-lg-7">
      <div class="card shadow-sm border-0 h-100 d-flex flex-column" style="background-color: var(--bs-card-bg);">
        <div class="card-body p-4 d-flex flex-column">
          <h5 class="card-title fw-bold text-body mb-4 m-0"><i class="bi bi-graph-up text-info me-2"></i>Department Activity Trend</h5>
          <div class="flex-grow-1 d-flex align-items-center justify-content-center w-100" id="trendChartContainer">
            <canvas id="trendChart" style="max-height: 300px; width: 100%;"></canvas>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Polar Area Chart: Category Workload -->
    <div class="col-lg-5">
      <div class="card shadow-sm border-0 h-100 d-flex flex-column" style="background-color: var(--bs-card-bg);">
        <div class="card-body p-4 d-flex flex-column">
          <h5 class="card-title fw-bold text-body mb-4 m-0"><i class="bi bi-diagram-3-fill me-2" style="color: #6f42c1;"></i>Category Workload</h5>
          <div class="flex-grow-1 d-flex align-items-center justify-content-center w-100" id="categoryChartContainer">
            <canvas id="categoryChart" style="max-height: 300px; width: 100%;"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

</section>

<!-- ── CRASH-PROOF JAVASCRIPT FOR CHARTS ───────────────────────────────────── -->
<th:block layout:fragment="page-scripts">
<script>
document.addEventListener("DOMContentLoaded", function() {

    // Helper to generate a placeholder if no data exists
    const noDataHTML = (iconClass) => `<div class="text-muted text-center w-100 py-5"><i class="bi ${iconClass} fs-1 opacity-25"></i><p class="mt-2">No data available.</p></div>`;

    // ── 1. Tasks per Member (Bar Chart) ──
    const barCtx = document.getElementById('memberTaskChart');
    if(barCtx) {
        const barPoints = document.querySelectorAll('.bar-data');
        let bLabels = [], bValues = [];
        
        barPoints.forEach(pt => {
            bLabels.push(pt.getAttribute('data-name') || 'Unknown');
            bValues.push(parseInt(pt.getAttribute('data-val')) || 0);
        });

        if(bLabels.length === 0) {
            document.getElementById('barChartContainer').innerHTML = noDataHTML('bi-bar-chart');
        } else {
            new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: bLabels,
                    datasets: [{
                        label: 'Total Tasks',
                        data: bValues,
                        backgroundColor: 'rgba(65, 84, 241, 0.8)',
                        borderColor: '#4154f1',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }
    }

    // ── 2. Status Distribution (Pie Chart) ──
    const pieCtx = document.getElementById('statusPieChart');
    if(pieCtx) {
        const piePoints = document.querySelectorAll('.pie-data');
        let pLabels = [], pValues = [], sum = 0;
        
        piePoints.forEach(pt => {
            let key = pt.getAttribute('data-key') || 'Unknown';
            let val = parseInt(pt.getAttribute('data-val')) || 0;
            pLabels.push(key.replace(/_/g, ' '));
            pValues.push(val);
            sum += val;
        });

        if(sum === 0) {
            document.getElementById('pieChartContainer').innerHTML = noDataHTML('bi-pie-chart');
        } else {
            const colors = ['#4154f1', '#198754', '#ffc107', '#dc3545', '#0dcaf0', '#6c757d'];
            new Chart(pieCtx, {
                type: 'doughnut',
                data: { labels: pLabels, datasets: [{ data: pValues, backgroundColor: colors, hoverOffset: 4 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }, cutout: '65%'
                }
            });
        }
    }

    // ── Extract Raw Data for Advanced Charts & New KPIs ──
    const rawTasks = document.querySelectorAll('.raw-task');
    let hoursMap = {};
    let priorityMap = { 'LOW': 0, 'MEDIUM': 0, 'HIGH': 0, 'CRITICAL': 0 };
    let categoryMap = {};
    let trendMap = {};
    let blockedCount = 0;
    let hasTasks = false;

    rawTasks.forEach(task => {
        hasTasks = true;
        const user = task.getAttribute('data-user');
        const hours = parseFloat(task.getAttribute('data-hours')) || 0;
        const priority = task.getAttribute('data-priority');
        const category = task.getAttribute('data-category');
        const date = task.getAttribute('data-date');
        const status = task.getAttribute('data-status');

        // Math for Hours Chart & Active Interns
        if (!hoursMap[user]) hoursMap[user] = 0;
        hoursMap[user] += hours;

        // Math for Priority Chart
        if (priorityMap[priority] !== undefined) priorityMap[priority]++;
        
        // Math for Category Chart
        if (!categoryMap[category]) categoryMap[category] = 0;
        categoryMap[category]++;
        
        // Math for Trend Chart
        if (date) {
            if (!trendMap[date]) trendMap[date] = 0;
            trendMap[date]++;
        }
        
        // Math for Blocked KPI
        if (status === 'BLOCKED') blockedCount++;
    });

    // Populate the 2 New KPIs via JS
    const activeInternsKPI = document.getElementById('kpi-active-interns');
    if (activeInternsKPI) activeInternsKPI.textContent = Object.keys(hoursMap).length;
    
    const blockedKPI = document.getElementById('kpi-blocked-tasks');
    if (blockedKPI) blockedKPI.textContent = blockedCount;

    // ── 3. Hours Logged per Member (Horizontal Bar Chart) ──
    const hoursCtx = document.getElementById('memberHoursChart');
    if (hoursCtx) {
        if (!hasTasks || Object.keys(hoursMap).length === 0) {
            document.getElementById('hoursChartContainer').innerHTML = noDataHTML('bi-bar-chart-steps');
        } else {
            new Chart(hoursCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(hoursMap),
                    datasets: [{
                        label: 'Total Hours',
                        data: Object.values(hoursMap),
                        backgroundColor: 'rgba(255, 193, 7, 0.8)',
                        borderColor: '#ffc107',
                        borderWidth: 1, borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y', // Makes it horizontal
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true } }
                }
            });
        }
    }

    // ── 4. Task Priority Breakdown (Doughnut Chart) ──
    const priorityCtx = document.getElementById('priorityChart');
    if (priorityCtx) {
        const pSum = Object.values(priorityMap).reduce((a, b) => a + b, 0);
        if (!hasTasks || pSum === 0) {
            document.getElementById('priorityChartContainer').innerHTML = noDataHTML('bi-exclamation-octagon');
        } else {
            // Colors: Low(Gray), Medium(Blue), High(Orange), Critical(Red)
            const prioColors = ['#e2e8f0', '#4154f1', '#fd7e14', '#dc3545'];
            new Chart(priorityCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(priorityMap),
                    datasets: [{
                        data: Object.values(priorityMap),
                        backgroundColor: prioColors,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }, cutout: '65%'
                }
            });
        }
    }

    // ── 5. Department Activity Trend (Line Chart) ──
    const trendCtx = document.getElementById('trendChart');
    if (trendCtx) {
        if (!hasTasks || Object.keys(trendMap).length === 0) {
            document.getElementById('trendChartContainer').innerHTML = noDataHTML('bi-graph-up');
        } else {
            // Sort dates chronologically
            const sortedDates = Object.keys(trendMap).sort();
            const trendData = sortedDates.map(date => trendMap[date]);
            
            // Format dates for nicer reading (e.g., "14 May")
            const niceLabels = sortedDates.map(dateStr => {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            });

            new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: niceLabels,
                    datasets: [{
                        label: 'Tasks Logged',
                        data: trendData,
                        borderColor: '#0dcaf0',
                        backgroundColor: 'rgba(13, 202, 240, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3, // Adds a nice smooth curve
                        pointBackgroundColor: '#0dcaf0',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, ticks: { stepSize: 1 } },
                        x: { grid: { display: false } } // Cleaner look
                    }
                }
            });
        }
    }

    // ── 6. Category Workload (Polar Area Chart) ──
    const categoryCtx = document.getElementById('categoryChart');
    if (categoryCtx) {
        if (!hasTasks || Object.keys(categoryMap).length === 0) {
            document.getElementById('categoryChartContainer').innerHTML = noDataHTML('bi-diagram-3');
        } else {
            // Distinct colors for different categories
            const catColors = [
                'rgba(111, 66, 193, 0.7)',  // Purple
                'rgba(25, 135, 84, 0.7)',   // Green
                'rgba(13, 202, 240, 0.7)',  // Cyan
                'rgba(253, 126, 20, 0.7)',  // Orange
                'rgba(65, 84, 241, 0.7)',   // Blue
                'rgba(220, 53, 69, 0.7)'    // Red
            ];
            
            new Chart(categoryCtx, {
                type: 'polarArea',
                data: {
                    labels: Object.keys(categoryMap),
                    datasets: [{
                        label: 'Tasks',
                        data: Object.values(categoryMap),
                        backgroundColor: catColors,
                        borderWidth: 1,
                        borderColor: 'rgba(255,255,255,0.1)' // cleaner border in dark mode
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    scales: {
                        r: {
                            ticks: { 
                                display: false, 
                                backdropColor: 'transparent' // completely hides the grey number boxes
                            },
                            grid: { 
                                color: 'rgba(150, 150, 150, 0.1)' // subtle web lines
                            },
                            angleLines: { 
                                color: 'rgba(150, 150, 150, 0.1)' 
                            }
                        }
                    }
                }
            });
        }
    }
});
</script>
</th:block>
</body>
</html>
