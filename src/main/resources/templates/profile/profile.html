<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>My Profile — ProgTrack</title>
    <style>
        .profile-avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .profile-initial {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #4154f1, #2cb8ff);
            color: white;
            font-size: 48px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<section layout:fragment="content">

    <div class="row g-4">

        <!-- ── LEFT COLUMN: User Card (Display Only) ───────────────────────── -->
        <!-- FIX: Made the column itself a flex container -->
        <div class="col-xl-4 d-flex flex-column">
            <!-- FIX: Added flex-grow-1 so it dynamically stretches -->
            <div class="card border-0 shadow-sm flex-grow-1 mb-0">
                <div class="card-body pt-5 pb-4 text-center d-flex flex-column">
                    
                    <!-- Profile Picture / Initial -->
                    <div class="profile-avatar-container mb-4">
                        <img th:if="${user.profilePicture != null && !user.profilePicture.isEmpty()}" 
                             th:src="@{/uploads/{pic}(pic=${user.profilePicture})}" 
                             alt="Profile" 
                             class="rounded-circle profile-avatar"/>
                        
                        <div th:unless="${user.profilePicture != null && !user.profilePicture.isEmpty()}" 
                             class="rounded-circle profile-initial"
                             th:text="${user.fullName.substring(0,1).toUpperCase()}">U
                        </div>
                    </div>

                    <!-- User Info -->
                    <h4 class="fw-bold mb-1" th:text="${user.fullName}">Full Name</h4>
                    <p class="text-muted small mb-3" th:text="${user.designation ?: 'No designation set'}">Designation</p>

                    <!-- Role Badge -->
                    <div>
                        <span class="badge rounded-pill px-3 py-2 mb-4"
                              th:classappend="${user.role.name()=='ADMIN' ? 'bg-dark' : 
                                              user.role.name()=='CEO' ? 'bg-danger' : 
                                              user.role.name()=='LEAD' ? 'bg-primary' : 'bg-secondary'}"
                              th:text="${user.role}">ROLE</span>
                    </div>

                    <!-- Contact Details List -->
                    <div class="text-start px-3 mb-4">
                        <div class="d-flex align-items-center mb-3">
                            <div class="rounded bg-light text-primary d-flex align-items-center justify-content-center me-3" style="width:36px;height:36px;">
                                <i class="bi bi-envelope"></i>
                            </div>
                            <div>
                                <h6 class="mb-0 small fw-bold">Email</h6>
                                <span class="text-muted small" th:text="${user.email}">email@example.com</span>
                            </div>
                        </div>
                        
                        <div class="d-flex align-items-center mb-3">
                            <div class="rounded bg-light text-success d-flex align-items-center justify-content-center me-3" style="width:36px;height:36px;">
                                <i class="bi bi-telephone"></i>
                            </div>
                            <div>
                                <h6 class="mb-0 small fw-bold">Phone</h6>
                                <span class="text-muted small" th:text="${user.phoneNumber ?: 'Not provided'}">Phone</span>
                            </div>
                        </div>

                        <div class="d-flex align-items-center mb-3">
                            <div class="rounded bg-light text-info d-flex align-items-center justify-content-center me-3" style="width:36px;height:36px;">
                                <i class="bi bi-building"></i>
                            </div>
                            <div>
                                <h6 class="mb-0 small fw-bold">Department</h6>
                                <span class="text-muted small" th:text="${user.department ?: 'Not assigned'}">Dept</span>
                            </div>
                        </div>

                        <div class="d-flex align-items-center">
                            <div class="rounded bg-light text-warning d-flex align-items-center justify-content-center me-3" style="width:36px;height:36px;">
                                <i class="bi bi-diagram-3"></i>
                            </div>
                            <div>
                                <h6 class="mb-0 small fw-bold">Project Group</h6>
                                <span class="text-muted small" th:text="${user.projectGroup ?: 'Not assigned'}">Group</span>
                            </div>
                        </div>
                    </div>

                    <!-- Pushes the bottom content down -->
                    <div class="mt-auto"></div>

                    <hr class="mx-3 mt-0 mb-3">

                    <!-- Work Stats List -->
                    <div class="text-start px-3 pb-2">
                        
                        
                        <div class="d-flex align-items-center mb-3">
                            <div class="rounded bg-light text-secondary d-flex align-items-center justify-content-center me-3" style="width:36px;height:36px;">
                                <i class="bi bi-calendar-check"></i>
                            </div>
                            <div>
                                <h6 class="mb-0 small fw-bold">Joined On</h6>
                                <span class="text-muted small" th:text="${user.createdAt != null ? #temporals.format(user.createdAt,'dd MMM yyyy') : '—'}">Date</span>
                            </div>
                        </div>

                        
                    </div>

                </div>
            </div>
        </div>

        <!-- ── RIGHT COLUMN: Forms ─────────────────────────────────────────────── -->
        <!-- FIX: Made the column itself a flex container -->
        <div class="col-xl-8 d-flex flex-column">

            <!-- Edit Details Card -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0"><i class="bi bi-person-lines-fill me-2 text-primary"></i>Profile Details</h5>
                </div>
                <div class="card-body pt-4">
                    <form th:action="@{/profile/update}" method="post" class="row g-3" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted mb-1">Full Name</label>
                            <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted mb-1">Email Address</label>
                            <input type="email" class="form-control bg-light" th:value="${user.email}" disabled title="Email cannot be changed"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted mb-1">Phone Number</label>
                            <input type="tel" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted mb-1">Designation</label>
                            <input type="text" name="designation" class="form-control" th:value="${user.designation}"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted mb-1">Department</label>
                            <input type="text" name="department" class="form-control" th:value="${user.department}"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted mb-1">Project Group</label>
                            <input type="text" name="projectGroup" class="form-control" th:value="${user.projectGroup}"/>
                        </div>
                        
                        <!-- Profile Picture Upload -->
                        <div class="col-12 mt-3">
                            <label class="form-label fw-semibold small text-muted mb-1">Update Profile Picture <span class="fw-normal" style="font-size: 11px;">(Optional)</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-image"></i></span>
                                <input type="file" name="profileImage" class="form-control" accept="image/png, image/jpeg, image/jpg"/>
                            </div>
                        </div>

                        <div class="col-12 mt-4 text-end">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Change Password Card -->
            <!-- FIX: mb-0 ensures no invisible bottom margin messes up the alignment -->
            <div class="card border-0 shadow-sm flex-grow-1 mb-0">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0"><i class="bi bi-shield-lock me-2 text-warning"></i>Security</h5>
                </div>
                <div class="card-body pt-4">
                    <form th:action="@{/profile/change-password}" method="post" class="row g-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-muted mb-1">Current Password</label>
                            <input type="password" name="currentPassword" class="form-control" required/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-muted mb-1">New Password</label>
                            <input type="password" name="newPassword" class="form-control" required minlength="6"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-muted mb-1">Confirm Password</label>
                            <input type="password" name="confirmPassword" class="form-control" required/>
                        </div>

                        <div class="col-12 mt-4 text-end">
                            <button type="submit" class="btn btn-warning px-4 text-dark fw-semibold">
                                <i class="bi bi-key me-1"></i> Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
        </div>
    </div>

</section>
</body>
</html>
