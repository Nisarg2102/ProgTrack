<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Leave Management — ProgTrack</title>
    
    <!-- FIX: Placed styles inside the page-head fragment so Thymeleaf correctly injects them into base.html -->
    <th:block layout:fragment="page-head">
        <style>
            /* ── FIXED Tab Styles ── */
            .custom-leave-tabs {
                border-bottom: 1px solid rgba(128, 128, 128, 0.2) !important;
                gap: 0.35rem;
                display: flex;
                padding-left: 0;
                margin-bottom: 1.5rem;
            }

            /* Target with :root to ensure we beat the base.html specificity */
            :root .custom-leave-tabs .nav-link {
                position: relative;
                color: #6c757d !important;
                background: transparent !important;
                border: none !important;
                padding: 0.8rem 1.2rem !important;
                font-weight: 600 !important;
                transition: all 0.2s ease;
                border-radius: 8px 8px 0 0 !important;
                opacity: 0.7;
            }

            :root .custom-leave-tabs .nav-link:hover {
                opacity: 1;
                background: rgba(65, 84, 241, 0.08) !important;
                color: #4154f1 !important;
            }

            /* THE INDICATOR LINE */
            :root .custom-leave-tabs .nav-link::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                bottom: -1px; /* Sits exactly on the UL border */
                height: 3px;
                background: transparent;
                transition: all 0.2s ease;
                z-index: 2;
            }

            /* ACTIVE STATE FIX */
            :root .custom-leave-tabs .nav-link.active {
                color: #4154f1 !important;
                background: rgba(65, 84, 241, 0.12) !important;
                opacity: 1 !important;
                font-weight: 700 !important;
            }

            :root .custom-leave-tabs .nav-link.active::after {
                background: #4154f1 !important;
                height: 2px;
            }

            /* DARK MODE SPECIFIC OVERRIDES */
            :root[data-theme="dark"] .custom-leave-tabs .nav-link {
                color: #94a3b8 !important;
            }

            :root[data-theme="dark"] .custom-leave-tabs .nav-link:hover {
                background: rgba(96, 165, 250, 0.08) !important;
                color: #e2e8f0 !important;
            }

            :root[data-theme="dark"] .custom-leave-tabs .nav-link.active {
                color: #60a5fa !important;
                background: rgba(96, 165, 250, 0.15) !important;
            }

            :root[data-theme="dark"] .custom-leave-tabs .nav-link.active::after {
                background: #60a5fa !important;
                box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
            }

            /* Re-enabling the highlight row for this page */
            .highlight-row td {
                animation: rowHighlightFlash 3s ease-out forwards !important;
            }
            :root[data-theme="dark"] .highlight-row td {
                animation: rowHighlightFlashDark 3s ease-out forwards !important;
            }
        </style>
    </th:block>
</head>
<body>
<section layout:fragment="content">

  <!-- ── STATUS FILTER TABS ──────────────────────────────────────────────── -->
  <ul class="nav custom-leave-tabs mb-4" id="leaveTabs">
    <li class="nav-item">
      <a class="nav-link active" href="#" onclick="filterLeaves(event,'ALL')">
        All <span class="badge bg-secondary ms-1" id="cnt-all">0</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" onclick="filterLeaves(event,'PENDING')">
        Pending <span class="badge bg-warning text-dark ms-1" id="cnt-pending">0</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" onclick="filterLeaves(event,'APPROVED')">
        Approved <span class="badge bg-success ms-1" id="cnt-approved">0</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" onclick="filterLeaves(event,'REJECTED')">
        Rejected <span class="badge bg-danger ms-1" id="cnt-rejected">0</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" onclick="filterLeaves(event,'CANCELLED')">
        Cancelled <span class="badge bg-secondary ms-1" id="cnt-cancelled">0</span>
      </a>
    </li>
  </ul>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">

      <div class="d-flex justify-content-between align-items-center p-4 border-bottom">
        <h5 class="card-title mb-0">
          <i class="bi bi-calendar-event me-2 text-primary"></i>Leave Requests
        </h5>
        <input type="search" id="leaveSearch" class="form-control form-control-sm"
               placeholder="Search by name, dept, type…" style="width:240px;"/>
      </div>

      <!-- Empty State -->
      <div th:if="${leaves == null or #lists.isEmpty(leaves)}"
           class="text-center text-muted py-5">
        <i class="bi bi-calendar-check fs-1 d-block mb-2 opacity-25"></i>
        <p class="mb-0 fw-bold text-dark">No leave requests found.</p>
      </div>

      <!-- Leave Table -->
      <div th:if="${leaves != null and not #lists.isEmpty(leaves)}"
           class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="leaveTable">
          <thead class="table-light">
            <tr>
              <th class="ps-2 py-3 text-muted small fw-bold text-uppercase">Employee</th>
              <th class="py-3 text-muted small fw-bold text-uppercase">Dept</th>
              <th class="py-3 text-muted small fw-bold text-uppercase">Type</th>
              <th class="py-3 text-muted small fw-bold text-uppercase">From</th>
              <th class="py-3 text-muted small fw-bold text-uppercase">To</th>
              <th class="py-3 text-muted small fw-bold text-uppercase text-center">Days</th>
              <th class="py-3 text-muted small fw-bold text-uppercase">Reason</th>
              <th class="py-3 text-muted small fw-bold text-uppercase">Applied</th>
              <th class="py-3 text-muted small fw-bold text-uppercase">Status</th>
              <th class="pe-2 py-3 text-muted small fw-bold text-uppercase text-end">Actions</th>
            </tr>
          </thead>
          <tbody>

            <th:block th:each="leave : ${leaves}">
              <tr th:if="${leave != null}"
                  th:id="'row-' + ${leave.id}"
                  th:with="leaveId=${leave.id},
                           userName=${leave.user != null and leave.user.fullName != null ? leave.user.fullName : 'Unknown'},
                           userDesig=${leave.user != null and leave.user.designation != null ? leave.user.designation : ''},
                           userDept=${leave.user != null and leave.user.department != null ? leave.user.department : '—'},
                           userPic=${leave.user != null ? leave.user.profilePicture : null},
                           statusName=${leave.status != null ? leave.status.name() : 'PENDING'}"
                  th:attr="data-status=${leave.status != null ? leave.status.name() : 'PENDING'}">

                <!-- Employee -->
                <td class="ps-2 py-3">
                  <div class="d-flex align-items-center gap-2">
                    <div th:if="${userPic != null and userPic != ''}"
                         class="rounded-circle shadow-sm overflow-hidden"
                         style="width:36px;height:36px;flex-shrink:0;">
                      <img th:src="@{'/uploads/' + ${userPic}}" alt="Avatar"
                           style="width:100%;height:100%;object-fit:cover;">
                    </div>
                    <div th:unless="${userPic != null and userPic != ''}"
                         class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
                         style="width:36px;height:36px;font-size:13px;flex-shrink:0;"
                         th:text="${userName.length() > 0 ? userName.substring(0,1).toUpperCase() : 'U'}">U</div>
                    <div>
                      <div class="fw-semibold small" th:text="${userName}">Name</div>
                      <small class="text-muted" th:text="${userDesig}"></small>
                    </div>
                  </div>
                </td>

                <!-- Department -->
                <td class="small" th:text="${userDept}">Dept</td>

                <!-- Type -->
                <td>
                  <span class="badge bg-info text-dark"
                        th:text="${leave.type != null ? leave.type.name().replace('_',' ') : '—'}">Type</span>
                </td>

                <!-- From -->
                <td class="small">
                  <span th:text="${leave.startDate != null ? #temporals.format(leave.startDate,'dd MMM yyyy') : '—'}">—</span>
                </td>

                <!-- To -->
                <td class="small">
                  <span th:text="${leave.endDate != null ? #temporals.format(leave.endDate,'dd MMM yyyy') : '—'}">—</span>
                </td>

                <!-- Days -->
                <td class="fw-semibold text-center" th:text="${leave.leaveDays}">1</td>

                <!-- Reason + Lead Comment -->
                <td class="small text-break" style="max-width:220px;white-space:normal;word-wrap:break-word;overflow-wrap:break-word;">
                  <span th:text="${leave.reason != null and leave.reason != '' ? leave.reason : '—'}">Reason</span>
                  <span th:if="${leave.leadComment != null and leave.leadComment != ''}"
                        class="d-block text-primary small mt-1">
                    <i class="bi bi-chat-text me-1"></i>
                    <em th:text="${leave.leadComment}">Comment</em>
                  </span>
                </td>

                <!-- Applied At -->
                <td class="small text-muted">
                  <span th:text="${leave.createdAt != null ? #temporals.format(leave.createdAt,'dd MMM, HH:mm') : '—'}">—</span>
                </td>

                <!-- Status Badge -->
                <td>
                  <span th:classappend="${statusName == 'APPROVED'  ? 'bg-success' :
                                         statusName == 'REJECTED'   ? 'bg-danger'  :
                                         statusName == 'CANCELLED'  ? 'bg-secondary' :
                                         'bg-warning text-dark'}"
                        class="badge"
                        th:text="${leave.status != null ? leave.status.name() : 'PENDING'}">Status</span>
                </td>

                <!-- Actions -->
                <td class="pe-2 text-end">
                  <div th:if="${statusName == 'PENDING'}" class="d-flex justify-content-end gap-2">
                    <form th:action="@{/leaves/approve/{id}(id=${leaveId})}" method="post" class="m-0">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit"
                              class="btn btn-success shadow-sm d-flex align-items-center justify-content-center"
                              style="width:32px;height:32px;padding:0;" title="Approve">
                        <i class="bi bi-check-lg fs-6"></i>
                      </button>
                    </form>
                    <button type="button"
                            class="btn btn-danger shadow-sm d-flex align-items-center justify-content-center"
                            style="width:32px;height:32px;padding:0;"
                            data-bs-toggle="modal"
                            th:attr="data-bs-target='#rejectModal-' + ${leaveId}"
                            title="Reject">
                      <i class="bi bi-x-lg fs-6"></i>
                    </button>
                  </div>

                  <span th:unless="${statusName == 'PENDING'}"
                        class="badge bg-light text-secondary border border-secondary border-opacity-25 px-2 py-1 shadow-sm"
                        style="font-weight:600;font-size:11px;letter-spacing:0.3px;">
                    <i class="bi me-1"
                       th:classappend="${statusName == 'CANCELLED' ? 'bi-person-x-fill' : 'bi-person-fill-check text-primary'}"></i>
                    <span th:text="${statusName == 'CANCELLED' ? userName : (leave.processedBy != null ? leave.processedBy.split('@')[0] : 'System')}">Lead</span>
                  </span>
                </td>

              </tr>
            </th:block>

          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- ── REJECT MODALS ────────────────────────────────────────────────────── -->
  <th:block th:if="${leaves != null and not #lists.isEmpty(leaves)}">
    <th:block th:each="leave : ${leaves}">
      <div th:if="${leave != null and leave.status != null and leave.status.name() == 'PENDING'}"
           th:with="leaveId=${leave.id},
                    userName=${leave.user != null and leave.user.fullName != null ? leave.user.fullName : 'Unknown'},
                    leaveTypeName=${leave.type != null ? leave.type.name() : '—'}"
           class="modal fade"
           th:id="'rejectModal-' + ${leaveId}"
           tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg" style="border-radius:12px;">
            <div class="modal-header bg-danger text-white border-0" style="border-radius:12px 12px 0 0;">
              <h5 class="modal-title fw-bold">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                Reject Leave — <span th:text="${userName}">User</span>
              </h5>
              <button type="button" class="btn-close btn-close-white shadow-none"
                      data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/leaves/reject/{id}(id=${leaveId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="modal-body p-4">
                <p class="text-muted small mb-4">
                  Type: <strong th:text="${leaveTypeName}">Type</strong>
                  &nbsp;|&nbsp;
                  <span th:text="${leave.startDate != null ? #temporals.format(leave.startDate,'dd MMM') : '—'}">—</span>
                  to
                  <span th:text="${leave.endDate != null ? #temporals.format(leave.endDate,'dd MMM yyyy') : '—'}">—</span>
                  (<span th:text="${leave.leaveDays}">1</span> day(s))
                </p>
                <label class="form-label fw-bold text-secondary small" style="letter-spacing:.5px;">
                  REASON FOR REJECTION <span class="text-muted fw-normal">(Optional)</span>
                </label>
                <textarea name="comment"
                          class="form-control shadow-none bg-light border-0 py-3"
                          rows="3"
                          placeholder="Provide a reason (optional)…"></textarea>
              </div>
              <div class="modal-footer border-0 p-4 pt-0">
                <button type="button" class="btn btn-light fw-bold px-4 shadow-sm border"
                        data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-danger fw-bold px-4 shadow-sm">
                  <i class="bi bi-x-circle me-1"></i>Confirm Reject
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </th:block>
  </th:block>

</section>

<!-- ── PAGE SCRIPTS ────────────────────────────────────────────────────────── -->
<th:block layout:fragment="page-scripts">
<script>
document.addEventListener("DOMContentLoaded", function () {

    var rows = document.querySelectorAll('#leaveTable tbody tr');

    // ── Count badges ────────────────────────────────────────────────────────
    var counts = { ALL: 0, PENDING: 0, APPROVED: 0, REJECTED: 0, CANCELLED: 0 };
    rows.forEach(function (r) {
        var s = r.getAttribute('data-status') || '';
        counts.ALL++;
        if (counts[s] !== undefined) counts[s]++;
    });
    Object.keys(counts).forEach(function (k) {
        var el = document.getElementById('cnt-' + k.toLowerCase());
        if (el) el.textContent = counts[k];
    });

    // ── Tab filter ──────────────────────────────────────────────────────────
	window.filterLeaves = function (e, status) {
	        e.preventDefault();
	        rows.forEach(function (r) {
	            r.style.display = (status === 'ALL' || r.getAttribute('data-status') === status) ? '' : 'none';
	        });
	        
	        // Find the closest .nav-link in case the badge was clicked
	        var target = e.target.closest('.nav-link');
	        document.querySelectorAll('#leaveTabs .nav-link').forEach(function (l) {
	            l.classList.remove('active');
	        });
	        target.classList.add('active');
	    };

    // ── Search ──────────────────────────────────────────────────────────────
    var searchInput = document.getElementById('leaveSearch');
    if (searchInput) {
        searchInput.addEventListener('keyup', function () {
            var q = this.value.toLowerCase().trim();
            rows.forEach(function (r) {
                r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        });
    }

    // ── Auto-highlight row from URL ?highlight=id ───────────────────────────
    var urlParams = new URLSearchParams(window.location.search);
    var highlightId = urlParams.get('highlight');
    if (highlightId) {
        // FIX: was 'leave-row-' but the actual table ids are 'row-'
        var targetRow = document.getElementById('row-' + highlightId);
        if (targetRow) {
            // Ensure All tab active so row is visible
            document.querySelectorAll('#leaveTabs .nav-link').forEach(function (l) {
                l.classList.remove('active');
            });
            document.querySelector('#leaveTabs .nav-link').classList.add('active');
            rows.forEach(function (r) { r.style.display = ''; });

            targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetRow.classList.add('highlight-row');
        }
    }

});
</script>
</th:block>
</body>
</html>
